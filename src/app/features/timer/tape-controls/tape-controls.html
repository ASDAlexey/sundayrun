<div class="timer-tape">
  @if (hasQueue()) {
    <!-- Two keys instead of one: a queued time is either somebody's lap or somebody's finish, and the
    sheet has to know which question it is answering before a surname is tapped. -->
    <div class="timer-tape__modes">
      <button
        class="timer-tape__toggle"
        i18n="@@timer.tapeToggleLap"
        type="button"
        [attr.aria-expanded]="mode() === modes.lap"
        [class.timer-tape__toggle_on]="mode() === modes.lap"
        [disabled]="lapWaiting() === 0"
        (click)="onToggle(modes.lap)"
      >
        Разобрать круг

        <span class="timer-tape__toggle-count">{{ lapWaiting() }}</span>
      </button>

      <button
        class="timer-tape__toggle"
        i18n="@@timer.tapeToggleFinish"
        type="button"
        [attr.aria-expanded]="mode() === modes.finish"
        [class.timer-tape__toggle_on]="mode() === modes.finish"
        [disabled]="finishWaiting() === 0"
        (click)="onToggle(modes.finish)"
      >
        Разобрать финиш

        <span class="timer-tape__toggle-count">{{ finishWaiting() }}</span>
      </button>
    </div>
  }

  <!-- Only while the race is on. A grey «ОТСЕЧКА» before the mass start needed a line of its own to
  explain itself, and on a 375 px phone that line wrapped to four rows and shouldered the key off the
  screen. Before the start there are exactly two things to do, and both are already on the floor. -->
  @if (canCut()) {
    <div class="timer-tape__keys">
      <button
        class="timer-tape__cut"
        i18n="@@timer.tapeCut"
        type="button"
        (keydown.enter)="onKeyCut($event)"
        (keydown.space)="onKeyCut($event)"
        (pointerdown)="onCut()"
      >
        Отсечка
      </button>
    </div>
  }

  @if (open()) {
    <dialog appTimerSheet class="timer-tape__sheet" (closed)="onClose()">
      <div class="timer-tape__sheet-head">
        <h2 class="timer-tape__sheet-title">{{ heading() }}</h2>

        <p class="timer-tape__sheet-hint" i18n="@@timer.tapePickHint">тапните фамилию — время уйдёт ей</p>
      </div>

      @if (emptyText(); as empty) {
        <p class="timer-tape__done">{{ empty }}</p>
      } @else {
        <ul class="timer-tape__list">
          @for (runner of runners(); track runner.id) {
            <li class="timer-tape__item">
              <button class="timer-tape__runner" type="button" (click)="onAssign(runner.id)">
                <span class="timer-tape__runner-name">{{ runner.fullName }}</span>

                <span class="timer-tape__runner-meta">{{ runner.metaText }}</span>

                <span class="timer-tape__runner-time"><app-race-time pinnedFraction [value]="runner.timeText" /></span>
              </button>
            </li>
          }
        </ul>
      }

      <button class="timer-tape__sheet-close" i18n="@@timer.tapeSheetClose" type="button" (click)="onClose()">Готово</button>
    </dialog>
  }
</div>
